# Production compose for EC2 — vocab API only.
# Runs: Postgres + vocab-service + api-gateway (public on :8000).
# Redis / invest-service / scheduler / frontend are intentionally omitted
# (vocab-service does not use Redis). To add the web UI later, uncomment the
# `frontend` block at the bottom and open port 3001 in the EC2 security group.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lexis
      POSTGRES_PASSWORD: lexis   # DB port is NOT published, so it is not reachable from the internet
      POSTGRES_DB: lexis
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vocab-service:
    build: ./services/vocab-service
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Optional web UI (uncomment to enable) ------------------------------
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     # Point the browser at the gateway's PUBLIC address (build-time bake-in).
  #     NEXT_PUBLIC_API_URL: http://<YOUR_EC2_PUBLIC_IP>:8000
  #   depends_on:
  #     - api-gateway
  #   restart: unless-stopped
  # Also add to api-gateway env: EXTRA_CORS_ORIGINS=http://<YOUR_EC2_PUBLIC_IP>:3001
  # ------------------------------------------------------------------------

volumes:
  db_data:
