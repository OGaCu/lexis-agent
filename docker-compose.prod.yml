# Production compose for EC2 — vocab stack.
# Always runs: Postgres + vocab-service + api-gateway (public on :8000).
# The `frontend` service is gated behind the "web" compose profile, so the
# default (API-only) deploy stays lightweight on a 1 GB free-tier box.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build            # API only
#   COMPOSE_PROFILES=web docker compose -f docker-compose.prod.yml up -d --build   # API + web UI
# (Put COMPOSE_PROFILES=web and PUBLIC_API_URL in .env to make it the default
#  everywhere, including the CodeDeploy deploy — see DEPLOY_EC2.md step 8.)

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lexis
      POSTGRES_PASSWORD: lexis   # DB port is NOT published, so it is not reachable from the internet
      POSTGRES_DB: lexis
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vocab-service:
    build: ./services/vocab-service
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Web UI — only started when the "web" profile is active (see header).
  frontend:
    profiles: ["web"]
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time -> the browser calls this URL.
        # Set PUBLIC_API_URL in .env to your gateway's public address, e.g.
        # http://<YOUR_EC2_PUBLIC_IP>:8000
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped
  # The gateway must also allow the browser origin. Add to .env:
  #   EXTRA_CORS_ORIGINS=http://<YOUR_EC2_PUBLIC_IP>:3001

volumes:
  db_data:
